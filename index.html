<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANYA VISION | SMART ALERT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root { --bg: #0b0f19; --card: #1e293b; --primary: #38bdf8; --neon: #fbbf24; --text: #f1f5f9; --alert: #f87171; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; font-family: 'Segoe UI', sans-serif; }
        .header { text-align: center; padding: 35px 0 10px; }
        .header h1 { font-size: 20px; color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 0; }
        .vision-frame { width: 100%; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); background: #000; margin-bottom: 10px; }
        .vision-frame img { width: 100%; display: block; min-height: 200px; }
        .control-panel { background: var(--card); border-radius: 15px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .switch { position: relative; width: 60px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--neon); box-shadow: 0 0 15px var(--neon); }
        input:checked + .slider:before { transform: translateX(30px); }
        .info-card { background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 20px; padding: 15px; border: 1px solid rgba(56, 189, 248, 0.3); }
        .sensor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .s-box { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .s-label { color: #94a3b8; font-size: 10px; display: block; margin-bottom: 2px; }
        .s-val { color: var(--primary); font-weight: bold; font-size: 16px; }
        .warn { color: var(--alert) !important; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>TANYA SMART VISION</h1>
        <div style="font-size:11px; color:#94a3b8;"><i class="fas fa-map-marker-alt"></i> ท่าม่วง กาญจนบุรี</div>
    </div>

    <div class="vision-frame">
        <img id="stream" src="http://192.168.1.184/" alt="LIVE CAM" onerror="this.src='https://via.placeholder.com/640x360?text=Camera+Offline'">
    </div>

    <div class="control-panel">
        <div style="font-weight:bold; font-size:14px;"><i class="fas fa-bolt" style="color:var(--neon)"></i> FLASH LED</div>
        <label class="switch"><input type="checkbox" onchange="toggleFlash(this)"><span class="slider"></span></label>
    </div>

    <div class="info-card">
        <div id="alert-box" style="display:none; background:rgba(248,113,113,0.2); padding:10px; border-radius:10px; margin-bottom:15px; border:1px solid var(--alert); font-size:13px; text-align:center; color:var(--alert);">
            <i class="fas fa-exclamation-triangle"></i> <span id="alert-msg">ตรวจพบค่าผิดปกติ!</span>
        </div>
        <div class="sensor-grid">
            <div class="s-box"><span class="s-label">อุณหภูมิ (F1)</span><span class="s-val" id="v1">--</span>°C</div>
            <div class="s-box"><span class="s-label">ความชื้น (F2)</span><span class="s-val" id="v2">--</span>%</div>
            <div class="s-box"><span class="s-label">ค่า VPD (F3)</span><span class="s-val" id="v3">--</span></div>
            <div class="s-box"><span class="s-label">ความชื้นดิน (F4)</span><span class="s-val" id="v4">--</span>%</div>
            <div class="s-box"><span class="s-label">eCO2 (F5)</span><span class="s-val" id="v5">--</span></div>
            <div class="s-box"><span class="s-label">TVOC (F6)</span><span class="s-val" id="v6">--</span></div>
            <div class="s-box"><span class="s-label">ฝนตก (F7)</span><span class="s-val" id="v7">--</span></div>
            <div class="s-box"><span class="s-label">แสง (F8)</span><span class="s-val" id="v8">--</span></div>
        </div>
    </div>

    <script>
        const camIP = "http://192.168.1.184/";
        const tsURL = "https://api.thingspeak.com/channels/2687634/feeds.json?results=1&api_key=YEYGJ3V1CV8V6OEY";
        let lastRainStatus = 0;

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'th-TH';
                window.speechSynthesis.speak(msg);
            }
        }

        function checkAlerts(f5, f6, f7) {
            let alerts = [];
            if (f5 > 1000) { alerts.push("ค่า คาร์บอนไดออกไซด์ สูงเกินมาตรฐานค่ะ"); $('#v5').addClass('warn'); } else { $('#v5').removeClass('warn'); }
            if (f6 > 500) { alerts.push("ค่า สารระเหย ทีวีโอซี สูงเกินเกณฑ์ค่ะ"); $('#v6').addClass('warn'); } else { $('#v6').removeClass('warn'); }
            if (f7 > 0 && lastRainStatus == 0) { alerts.push("ตรวจพบฝนตกในพื้นที่ค่ะ"); }
            
            lastRainStatus = f7;

            if (alerts.length > 0) {
                $('#alert-box').fadeIn();
                $('#alert-msg').text(alerts[0]);
                speak("คำเตือนค่ะ " + alerts.join(" และ "));
            } else {
                $('#alert-box').fadeOut();
            }
        }

        function updateData() {
            $.get(tsURL, function(data) {
                const f = data.feeds[0];
                $('#v1').text(parseFloat(f.field1).toFixed(1));
                $('#v2').text(parseFloat(f.field2).toFixed(1));
                $('#v3').text(parseFloat(f.field3).toFixed(2));
                $('#v4').text(parseFloat(f.field4).toFixed(1));
                $('#v5').text(parseInt(f.field5));
                $('#v6').text(parseInt(f.field6));
                $('#v7').text(parseFloat(f.field7) > 0 ? "ตรวจพบฝน" : "ปกติ");
                $('#v8').text(parseFloat(f.field8).toFixed(0));
                
                checkAlerts(parseInt(f.field5), parseInt(f.field6), parseFloat(f.field7));
            });
        }

        function toggleFlash(el) {
            fetch(`${camIP}led?status=${el.checked ? "on" : "off"}`, { mode: 'no-cors' });
            speak(el.checked ? "เปิดไฟแฟลชค่ะ" : "ปิดไฟแฟลชค่ะ");
        }

        setInterval(updateData, 25000);
        updateData();
        document.body.onclick = function() { speak("ระบบเสียงพร้อมทำงานแล้วค่ะ"); updateData(); };
    </script>
</body>
</html>
