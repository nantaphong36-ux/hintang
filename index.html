<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tanya Smart Farm Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a; --card: rgba(255, 255, 255, 0.07);
            --accent: #00d2ff; --text: #ffffff; --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ff4757; --safe: #2ed573;
        }
        body.light-mode {
            --bg: #f0f2f5; --card: rgba(255, 255, 255, 0.9);
            --accent: #0284c7; --text: #1a1d26; --glass-border: rgba(0, 0, 0, 0.1);
        }
        body { background: var(--bg); color: var(--text); font-family: 'Prompt', sans-serif; margin: 0; padding: 5px; transition: 0.5s; overflow-x: hidden; }
        .container { width: 100%; max-width: 800px; margin: auto; min-height: 100vh; display: flex; flex-direction: column; }

        .header-box { background: var(--card); backdrop-filter: blur(10px); padding: 15px 10px; border-radius: 20px; text-align: center; margin-bottom: 8px; border: 1px solid var(--glass-border); position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header-text h1 { margin: 0; font-size: 0.95rem; font-weight: 600; }
        .header-text p { margin: 0; font-size: 0.65rem; opacity: 0.7; color: var(--accent); }

        .controls-top { position: absolute; top: 8px; right: 15px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .theme-toggle { background: none; border: none; color: var(--text); cursor: pointer; font-size: 1.1rem; padding: 0; }
        .wifi-status { font-size: 0.65rem; color: var(--accent); display: flex; align-items: center; gap: 4px; font-weight: 600; }

        .glass-card { background: var(--card); backdrop-filter: blur(15px); padding: 12px; border-radius: 25px; border: 1px solid var(--glass-border); margin-bottom: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }

        .weather-sub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 0.65rem; margin-top: 10px; border-top: 1px solid var(--glass-border); padding-top: 10px; }
        .weather-sub div { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        .s-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
        .s-box { background: #fff; padding: 10px 2px; border-radius: 18px; text-align: center; color: #1e293b; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .s-box i { font-size: 1rem; display: block; margin-bottom: 3px; }
        .s-box b { font-size: 0.85rem; display: block; }

        .r-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .r-btn { background: var(--card); border: 1px solid var(--glass-border); padding: 15px 2px; border-radius: 20px; color: var(--text); cursor: pointer; width: 100%; transition: 0.3s; }
        .active-tap { background: #3b82f6 !important; }
        .active-spray { background: #00d2ff !important; }
        .active-fan { background: #22c55e !important; }
        .active-roof { background: #facc15 !important; color: #000 !important; }
        
        .mode-btn { font-size: 0.55rem; padding: 4px; border-radius: 6px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); cursor: pointer; margin-bottom: 5px; width: 100%; }
        .mode-active { background: var(--safe); border: none; font-weight: 600; }

        .footer { margin-top: auto; padding: 15px 10px; text-align: center; font-size: 0.6rem; opacity: 0.6; line-height: 1.6; }
    </style>
</head>
<body class="dark-mode">

<div class="container">
    <div class="header-box">
        <img src="https://img5.pic.in.th/file/secure-sv1/leaf50x50.png" width="28">
        <div class="header-text"><h1>TANYA SMART FARM PRO</h1><p>ท่าม่วง, กาญจนบุรี</p></div>
        <div class="controls-top">
            <div class="wifi-status"><i class="fa-solid fa-wifi"></i> <span id="wifi-val">--</span></div>
            <button class="theme-toggle" onclick="toggleTheme()"><i id="th-icon" class="fa-solid fa-moon"></i></button>
        </div>
    </div>

    <div class="glass-card">
        <div style="display:flex; align-items:center; justify-content:center; gap:12px;">
            <img id="w-icon" src="https://openweathermap.org/img/wn/01d@2x.png" width="75">
            <div id="ext-temp" style="font-size:2.8rem; font-weight:600;">--°C</div>
        </div>
        <div class="weather-sub">
            <div><span style="opacity:0.7">💧 ชื้นอากาศ</span><b id="ext-hum">--%</b></div>
            <div><span style="opacity:0.7">💨 ลม</span><b id="ext-wind">--m/s</b></div>
            <div><span style="opacity:0.7">☀️ UV Index</span><b id="ext-uv">--</b></div>
            <div><span style="opacity:0.7">🌅 ขึ้น</span><b id="sunrise">--:--</b></div>
            <div><span style="opacity:0.7">🌇 ตก</span><b id="sunset">--:--</b></div>
            <div><span style="opacity:0.7">😷 AQI</span><b id="ext-aqi">--</b></div>
        </div>
    </div>

    <div class="glass-card">
        <div class="s-grid">
            <div class="s-box"><i class="fa-solid fa-temperature-half" style="color:#ff4757"></i><span>Temp</span><b id="s-temp">--</b></div>
            <div class="s-box"><i class="fa-solid fa-droplet" style="color:#3498db"></i><span>Humi</span><b id="s-hum">--</b></div>
            <div class="s-box"><i class="fa-solid fa-seedling" style="color:#2ecc71"></i><span>Soil</span><b id="v-moist">--</b></div>
            <div class="s-box"><i class="fa-solid fa-wind" style="color:#1abc9c"></i><span>VPD</span><b id="s-vpd">--</b></div>
            <div class="s-box"><i class="fa-solid fa-sun" style="color:#f1c40f"></i><span>Light</span><b id="s-lux">--</b></div>
            <div class="s-box"><i class="fa-solid fa-gauge-high" style="color:#9b59b6"></i><span>Press</span><b id="s-pres">--</b></div>
            <div class="s-box"><i class="fa-solid fa-water" style="color:#3498db"></i><span>DewP</span><b id="s-dew">--</b></div>
            <div class="s-box"><i class="fa-solid fa-mountain" style="color:#7f8c8d"></i><span>Alt</span><b>15</b></div>
        </div>
    </div>

    <div class="glass-card">
        <div class="r-grid">
            <div><button id="tap-mode" class="mode-btn mode-active" onclick="toggleAuto()">Auto</button><button class="r-btn" id="btn-tap" onclick="btnClick('tap')"><i class="fa-solid fa-faucet-drip"></i><span>ก็อกน้ำ</span></button></div>
            <div><div style="height:23px"></div><button class="r-btn" id="btn-spray" onclick="btnClick('spray')"><i class="fa-solid fa-spray-can"></i><span>Spray</span></button></div>
            <div><div style="height:23px"></div><button class="r-btn" id="btn-fan" onclick="btnClick('fan')"><i class="fa-solid fa-fan"></i><span>Fan</span></button></div>
            <div><div style="height:23px"></div><button class="r-btn" id="btn-roof" onclick="btnClick('roof')"><i class="fa-solid fa-warehouse"></i><span>หลังคา</span></button></div>
        </div>
    </div>

    <div class="footer">
        Dashboard by Tanya & Gemini | © Copyright 2026<br>
        อัปเดตล่าสุด: <span id="last-update">--:--:--</span>
    </div>
</div>

<iframe id="blynk-frame" style="display:none;"></iframe>

<script>
    let isAuto = true;
    const blynkAuth = "qXn6VGKqQTkrteXQPIw66e97JkdKlg-u";
    const blynkServer = "159.65.131.215:8080";
    const weatherKey = "02868cd5e15cf0f70bfe001a9822c367";

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        document.getElementById('th-icon').className = document.body.classList.contains('light-mode') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    function toggleAuto() {
        isAuto = !isAuto;
        document.getElementById('tap-mode').innerText = isAuto ? "Auto" : "Manual";
        document.getElementById('tap-mode').classList.toggle('mode-active');
    }

    function getUVLabel(uv) {
        if (uv < 3) return { text: "ต่ำ", color: "#2ed573" };
        if (uv < 6) return { text: "ปานกลาง", color: "#f1c40f" };
        if (uv < 8) return { text: "สูง", color: "#e67e22" };
        if (uv < 11) return { text: "สูงมาก", color: "#ff4757" };
        return { text: "สูงจัด!", color: "#8e44ad" };
    }

    function getAQILabel(aqi) {
        const labels = {1:{text:"ดีมาก",color:"#2ed573"},2:{text:"ดี",color:"#7bed9f"},3:{text:"ปานกลาง",color:"#f1c40f"},4:{text:"เริ่มแย่",color:"#e67e22"},5:{text:"อันตราย!",color:"#ff4757"}};
        return labels[aqi] || { text: "N/A", color: "#fff" };
    }

    async function getWeatherData() {
        try {
            const wRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=13.96&lon=99.64&appid=${weatherKey}&units=metric&lang=th`);
            const wData = await wRes.json();
            document.getElementById('ext-temp').innerText = wData.main.temp.toFixed(1) + "°C";
            document.getElementById('ext-hum').innerText = wData.main.humidity + "%";
            document.getElementById('ext-wind').innerText = wData.wind.speed + "m/s";
            document.getElementById('w-icon').src = `https://openweathermap.org/img/wn/${wData.weather[0].icon}@2x.png`;
            document.getElementById('sunrise').innerText = new Date(wData.sys.sunrise * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
            document.getElementById('sunset').innerText = new Date(wData.sys.sunset * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});

            const uvRes = await fetch(`https://api.openweathermap.org/data/2.5/uvi?lat=13.96&lon=99.64&appid=${weatherKey}`);
            const uvData = await uvRes.json();
            const uvVal = Math.round(uvData.value);
            const uvInfo = getUVLabel(uvVal);
            document.getElementById('ext-uv').innerHTML = `${uvVal} <span style="font-size:0.5rem; color:${uvInfo.color}">(${uvInfo.text})</span>`;
            document.getElementById('ext-uv').style.color = uvInfo.color;

            const aqiRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=13.96&lon=99.64&appid=${weatherKey}`);
            const aqiData = await aqiRes.json();
            const aqiVal = aqiData.list[0].main.aqi;
            const aqiInfo = getAQILabel(aqiVal);
            document.getElementById('ext-aqi').innerHTML = `${aqiVal} <span style="font-size:0.5rem; color:${aqiInfo.color}">(${aqiInfo.text})</span>`;
            document.getElementById('ext-aqi').style.color = aqiInfo.color;
            document.getElementById('last-update').innerText = new Date().toLocaleTimeString('th-TH');
        } catch (e) { }
    }

    // แก้ไขการดึงข้อมูลโดยใช้ Proxy หรือการเรียกแบบไม่สน Response เพื่อลดการบล็อก
    async function updateBlynk() {
        try {
            const res = await fetch(`http://${blynkServer}/${blynkAuth}/get/V1/V2/V3/V4/V5/V6/V7/V16/V10/V11/V12/V13`).catch(e => null);
            if (!res) return;
            const d = await res.json();
            if (d && d.length >= 12) {
                document.getElementById('s-temp').innerText = parseFloat(d[0]).toFixed(1);
                document.getElementById('s-hum').innerText = d[1] + "%";
                document.getElementById('v-moist').innerText = d[2] + "%";
                document.getElementById('wifi-val').innerText = d[7] + " dBm";
                updateBtnState('tap', d[8]); updateBtnState('spray', d[9]);
                updateBtnState('fan', d[10]); updateBtnState('roof', d[11]);
            }
        } catch (e) { }
    }

    function updateBtnState(type, val) {
        const btn = document.getElementById('btn-' + type);
        if (val == "1") btn.classList.add('active-' + type);
        else btn.classList.remove('active-' + type);
    }

    // ฟังก์ชันสั่งงานปุ่มแบบบังคับเปิด (แก้ปัญหา Google Sites บล็อก)
    function btnClick(type) {
        if(type === 'tap' && isAuto) return alert("โปรดเปลี่ยนเป็น Manual");
        const btn = document.getElementById('btn-'+type);
        const newVal = btn.classList.contains('active-'+type) ? "0" : "1";
        const vPin = {tap:"V10", spray:"V11", fan:"V12", roof:"V13"}[type];
        
        const url = `http://${blynkServer}/${blynkAuth}/update/${vPin}?value=${newVal}`;
        
        // วิธีแก้ตายตัว: เปิดหน้าต่างใหม่ขนาดจิ๋วแล้วปิดทันที
        const win = window.open(url, "blynk_update", "width=1,height=1,left=10000,top=10000");
        setTimeout(() => { if(win) win.close(); }, 500);

        // เปลี่ยนสีปุ่มที่หน้าจอทันที
        if(newVal === "1") btn.classList.add('active-'+type);
        else btn.classList.remove('active-'+type);
    }

    getWeatherData(); updateBlynk();
    setInterval(updateBlynk, 3000);
    setInterval(getWeatherData, 600000);
</script>
</body>
</html>
