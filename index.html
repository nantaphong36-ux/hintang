<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TANYA SMART FARM | Professional Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <style>
        :root { 
            --danger: #ff4d4d; --warning: #f39c12; --success: #00f2fe; --primary: #4facfe; --ai-purple: #a855f7;
            --bg: #0b0f19; --card: rgba(30, 41, 59, 0.7); --text: #f8fafc; --border: rgba(255,255,255,0.1);
        }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Header & Status */
        .header { text-align: center; padding: 20px 0; margin-top: 30px; }
        .header h1 { margin: 0; font-size: 22px; color: var(--primary); letter-spacing: 2px; }
        .sys-status { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: var(--card); padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); font-size: 11px; }
        .online-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; background: #666; }

        /* Camera Section */
        .vision-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .cam-container { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        .cam-container img { width: 100%; height: 100%; object-fit: cover; }
        .cam-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; font-size: 10px; color: var(--success); border: 1px solid var(--border); z-index: 2; }
        
        /* Button Styles */
        .cam-btn-group { padding: 12px; display: flex; gap: 8px; background: rgba(0,0,0,0.3); }
        .btn-sw { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: var(--text); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; transition: 0.3s; }
        .btn-sw:active { transform: scale(0.95); }
        .btn-on { background: var(--primary) !important; color: white; }
        .btn-flash-on { background: var(--warning) !important; color: black; }

        /* Grid Layout */
        .sensor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        @media (min-width: 768px) { .sensor-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .s-card { background: var(--card); border-radius: 15px; padding: 15px; text-align: center; border: 1px solid var(--border); transition: 0.3s; }
        .s-card i { font-size: 24px; margin-bottom: 8px; display: block; color: var(--primary); }
        .s-card .val { font-size: 22px; font-weight: bold; }
        .s-card .unit { font-size: 11px; opacity: 0.6; }

        /* Alert Area */
        .alert-panel { background: rgba(168, 85, 247, 0.1); border-radius: 15px; padding: 15px; border: 1px solid var(--ai-purple); margin-bottom: 15px; }
        
        .chart-container { background: var(--card); border-radius: 20px; padding: 15px; border: 1px solid var(--border); margin-bottom: 15px; height: 300px; }
    </style>
</head>
<body>

    <div class="sys-status">
        <div><span class="online-dot" id="stat-dot"></span> <span id="stat-text">System Connecting...</span></div>
        <div id="real-time">00:00:00</div>
    </div>

    <div class="header">
        <h1><i class="fas fa-leaf"></i> TANYA SMART FARM</h1>
        <p style="font-size: 10px; opacity: 0.5; margin: 5px 0 0;">Professional Cloud Dashboard V17.1</p>
    </div>

    <div class="vision-card">
        <div class="cam-container" id="cam-box">
            <span class="cam-label" id="cam-status-tag"><i class="fas fa-video"></i> LIVE STREAM</span>
            <img id="farm-cam" src="http://192.168.1.184/" alt="Camera View">
            <div id="cam-block-msg" style="display:none; text-align:center; padding: 20px;">
                <i class="fas fa-shield-alt" style="font-size: 40px; color: var(--danger); margin-bottom: 10px;"></i>
                <p style="font-size: 12px;">Browser บล็อกการเข้าถึงกล้อง (Insecure Content)</p>
                <button onclick="window.open('http://192.168.1.184/', '_blank')" class="btn-sw" style="background: var(--success); color: #000; margin-top: 10px;">
                    ปลดล็อกการเชื่อมต่อ
                </button>
            </div>
        </div>
        <div class="cam-btn-group">
            <button class="btn-sw btn-on" id="cam-toggle" onclick="toggleCam()">
                <i class="fas fa-camera"></i> <span id="cam-text">ปิดกล้อง</span>
            </button>
            <button class="btn-sw" onclick="refreshCam()">
                <i class="fas fa-sync"></i> รีเฟรช
            </button>
            <button class="btn-sw" id="flash-toggle" onclick="toggleFlash()">
                <i class="fas fa-lightbulb"></i> ไฟ Flash
            </button>
        </div>
    </div>

    <div class="alert-panel" id="ai-panel">
        <div style="color: var(--ai-purple); font-weight: bold; margin-bottom: 5px; font-size: 12px;">
            <i class="fas fa-brain"></i> AI ANALYTICS:
        </div>
        <div id="ai-msg" style="font-size: 11px;">กำลังวิเคราะห์ข้อมูลฟาร์ม...</div>
    </div>

    <div class="sensor-grid">
        <div class="s-card"><i class="fas fa-thermometer-half"></i><span class="val" id="v1">--</span><br><span class="unit">Temp (°C)</span></div>
        <div class="s-card"><i class="fas fa-tint"></i><span class="val" id="v2">--</span><br><span class="unit">Humid (%)</span></div>
        <div class="s-card"><i class="fas fa-seedling"></i><span class="val" id="v4">--</span><br><span class="unit">Soil (%)</span></div>
        <div class="s-card"><i class="fas fa-cloud-rain"></i><span class="val" id="v7">--</span><br><span class="unit">Rain (%)</span></div>
    </div>

    <div class="chart-container" id="chart-main"></div>

    <script>
        const camURL = "http://192.168.1.184/";
        let isCamOn = true;
        let isFlashOn = false;

        // --- Camera Logic ---
        function toggleCam() {
            isCamOn = !isCamOn;
            const camImg = document.getElementById('farm-cam');
            const btn = document.getElementById('cam-toggle');
            if(isCamOn) {
                camImg.src = camURL + "?t=" + new Date().getTime();
                $(camImg).show();
                btn.classList.add('btn-on');
                document.getElementById('cam-text').innerText = "ปิดกล้อง";
            } else {
                camImg.src = "";
                $(camImg).hide();
                btn.classList.remove('btn-on');
                document.getElementById('cam-text').innerText = "เปิดกล้อง";
            }
        }

        function refreshCam() {
            if(!isCamOn) return;
            document.getElementById('farm-cam').src = camURL + "?t=" + new Date().getTime();
        }

        function toggleFlash() {
            isFlashOn = !isFlashOn;
            const state = isFlashOn ? "on" : "off";
            const btn = document.getElementById('flash-toggle');
            fetch(`${camURL}led?status=${state}`).then(() => {
                if(isFlashOn) btn.classList.add('btn-flash-on');
                else btn.classList.remove('btn-flash-on');
            }).catch(() => {
                alert("ไม่สามารถติดต่อกล้องได้ โปรดเช็คการปลดล็อก HTTPS");
            });
        }

        // ตรวจสอบว่าภาพกล้องถูกบล็อกหรือไม่
        document.getElementById('farm-cam').onerror = function() {
            if(isCamOn) {
                document.getElementById('cam-block-msg').style.display = 'block';
                this.style.display = 'none';
            }
        };

        // --- Data & Charts ---
        function updateClock() {
            document.getElementById('real-time').innerText = new Date().toLocaleTimeString();
        }

        const chart = Highcharts.chart('chart-main', {
            chart: { backgroundColor: 'transparent', style: { fontFamily: 'Segoe UI' } },
            title: { text: 'Environmental Tracking', style: { color: '#4facfe', fontSize: '12px' } },
            xAxis: { type: 'datetime', labels: { style: { color: '#666' } } },
            yAxis: { title: null, gridLineColor: 'rgba(255,255,255,0.05)' },
            series: [{ name: 'Temperature', data: [], color: '#ff4d4d' }, { name: 'Humidity', data: [], color: '#4facfe' }],
            credits: { enabled: false }
        });

        function fetchData() {
            // ดึงข้อมูลจาก ThingSpeak ของคุณ
            $.getJSON(`https://api.thingspeak.com/channels/2687634/feeds.json?results=20`, function(data) {
                const last = data.feeds[data.feeds.length - 1];
                $('#v1').text(parseFloat(last.field1).toFixed(1));
                $('#v2').text(parseFloat(last.field2).toFixed(1));
                $('#v4').text(parseFloat(last.field4).toFixed(0));
                $('#v7').text(parseFloat(last.field7).toFixed(0));
                
                // Update Status
                document.getElementById('stat-dot').style.background = '#00f2fe';
                document.getElementById('stat-text').innerText = 'System Online';

                // AI Analysis Simple Logic
                if(parseFloat(last.field7) > 50) $('#ai-msg').html("<span style='color:var(--danger)'>⛈️ ตรวจพบฝน! แนะนำให้ปิดหลังคาฟาร์ม</span>");
                else $('#ai-msg').text("✅ สภาวะอากาศปกติ ระบบทำงานตามแผนงาน");
            });
        }

        setInterval(updateClock, 1000);
        setInterval(fetchData, 15000);
        fetchData();
    </script>
</body>
</html>
