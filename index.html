<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TANYA FARM V92.0</title>
    <style>
        :root { --bg: #0b101a; --card: #1e293b; --primary: #38bdf8; --text: #f1f5f9; --ok: #4ade80; --danger: #f87171; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; }
        
        /* หน้าจอเริ่มต้น ป้องกัน Android บล็อกเสียง */
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .big-btn { background: var(--ok); color: #000; border: none; padding: 30px 80px; border-radius: 20px; font-size: 28px; font-weight: bold; cursor: pointer; }

        .header { text-align: center; padding: 10px; border-bottom: 2px solid var(--primary); margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: var(--card); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .val { font-size: 28px; font-weight: bold; margin-top: 5px; }
        
        .ai-zone { background: rgba(56, 189, 248, 0.1); border: 2px solid var(--primary); padding: 15px; border-radius: 15px; margin-top: 15px; }
        .msg { font-size: 18px; font-weight: bold; color: var(--ok); line-height: 1.5; }
        .warn { color: var(--danger); animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0.4; } }
        .footer-btn { position: fixed; bottom: 20px; right: 20px; width: 65px; height: 65px; background: #38bdf8; border-radius: 50%; border: none; font-size: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="color:var(--primary)">TANYA FARM</h1>
        <p>แตะปุ่มเพื่อเปิดระบบ</p>
        <button class="big-btn" onclick="initSystem()">START</button>
    </div>

    <div class="header">
        <div style="font-size: 22px; font-weight: bold; color: var(--primary);">TANYA SMART FARM</div>
        <div id="timer" style="font-size: 14px; color: #94a3b8;">--:--</div>
    </div>

    <div class="grid">
        <div class="card"><small>Temp (F1)</small><div class="val" id="f1">--</div></div>
        <div class="card"><small>Hum (F2)</small><div class="val" id="f2">--</div></div>
        <div class="card"><small>VPD (F3)</small><div class="val" id="f3">--</div></div>
        <div class="card"><small>Soil (F4)</small><div class="val" id="f4">--</div></div>
        <div class="card"><small>CO2 (F5)</small><div class="val" id="f5">--</div></div>
        <div class="card"><small>VOC (F6)</small><div class="val" id="f6">--</div></div>
        <div class="card"><small>Rain (F7)</small><div class="val" id="f7">--</div></div>
        <div class="card"><small>Light (F8)</small><div class="val" id="f8">--</div></div>
    </div>

    <div class="ai-zone">
        <div style="font-size: 12px; color: var(--primary); margin-bottom: 5px;">🤖 AI AUDITOR ADVICE:</div>
        <div id="ai-msg" class="msg">กำลังโหลดข้อมูล...</div>
    </div>

    <button class="footer-btn" onclick="location.reload()">🔄</button>

    <script>
        let voiceReady = false;

        function initSystem() {
            document.getElementById('start-overlay').style.display = 'none';
            voiceReady = true;
            // ปลดล็อคเสียง
            window.speechSynthesis.cancel();
            const startMsg = new SpeechSynthesisUtterance("ระบบเริ่มทำงานค่ะ");
            startMsg.lang = "th-TH";
            window.speechSynthesis.speak(startMsg);
            
            fetchData();
            setInterval(fetchData, 30000);
        }

        async function fetchData() {
            try {
                const response = await fetch(`https://api.thingspeak.com/channels/2687634/feeds.json?results=1&api_key=YEYGJ3V1CV8V6OEY&_=${new Date().getTime()}`);
                const data = await response.json();
                const f = data.feeds[0];
                const v = [f.field1, f.field2, f.field3, f.field4, f.field5, f.field6, f.field7, f.field8].map(x => parseFloat(x) || 0);

                // แสดงผลเซนเซอร์
                for(let i=1; i<=8; i++) {
                    const el = document.getElementById('f'+i);
                    const val = v[i-1];
                    el.innerText = (i==3) ? val.toFixed(2) : (i==7 ? (val>0?"ฝนตก":"ปกติ") : val.toFixed(1));
                    
                    // เปลี่ยนสีเมื่ออันตราย
                    el.classList.remove('warn');
                    if((i==1 && val>33) || (i==3 && val>1.6) || (i==7 && val>0)) el.classList.add('warn');
                }

                // AI แนะนำ
                let txt = "✅ สภาวะปกติ พืชเจริญเติบโตได้ดีค่ะ";
                let speech = "";
                
                if(v[6]>0) { txt = "🚨 ฝนตก! ปิดช่องระบายอากาศด่วนค่ะ"; speech = "คำเตือน ฝนตก ปิดช่องระบายอากาศด่วนค่ะ"; }
                else if(v[0]>33) { txt = "🚨 ร้อนจัด! เปิดพัดลมระบายอากาศค่ะ"; speech = "คำเตือน อากาศร้อนเกินไป เปิดพัดลมด่วนค่ะ"; }
                else if(v[2]>1.6) { txt = "🚨 VPD วิกฤต! เปิดระบบพ่นหมอกด่วนค่ะ"; speech = "คำเตือน วี พี ดี สูงเกินไป เปิดระบบพ่นหมอกด่วนค่ะ"; }

                document.getElementById('ai-msg').innerHTML = txt;
                if(speech !== "") speak(speech);
                document.getElementById('timer').innerText = new Date().toLocaleTimeString('th-TH');

            } catch (err) {
                document.getElementById('ai-msg').innerText = "เชื่อมต่อข้อมูลไม่ได้...";
            }
        }

        function speak(text) {
            if(!voiceReady) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = "th-TH";
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
