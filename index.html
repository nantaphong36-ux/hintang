<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Farm Monitor - ThingSpeak</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2e7d32; --bg: #f1f8e9; --accent: #ffd600; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); text-align: center; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .ai-status { background: #e3f2fd; padding: 20px; border-radius: 20px; margin-bottom: 20px; border-left: 10px solid #2196f3; min-height: 80px; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 1.1em; color: #0d47a1; }
        .sensor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #eee; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .label { font-size: 0.8em; color: #777; margin-bottom: 5px; }
        .value { font-size: 1.6em; font-weight: 600; color: #2c3e50; }
        .unit { font-size: 0.6em; color: #999; margin-left: 5px; }
        .voice-btn { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px; cursor: pointer; font-size: 1.1em; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(46,125,50,0.3); }
        .voice-btn.active { background: #9e9e9e; box-shadow: none; }
        .footer { margin-top: 20px; font-size: 0.7em; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 AI Smart Farm Monitor</h1>
    <button id="startBtn" class="voice-btn" onclick="initAI()">🎯 เปิดระบบเสียงแจ้งเตือน AI</button>

    <div class="ai-status">
        <div id="ai-text">กรุณากดปุ่มด้านบนเพื่อเริ่มการทำงาน...</div>
    </div>

    <div class="sensor-grid">
        <div class="card"><div class="label">อุณหภูมิอากาศ</div><div class="value"><span id="f1">--</span><span class="unit">°C</span></div></div>
        <div class="card"><div class="label">ความชื้นอากาศ</div><div class="value"><span id="f2">--</span><span class="unit">%RH</span></div></div>
        <div class="card"><div class="label">ค่า VPD</div><div id="vpd-box" class="value"><span id="f3">--</span><span class="unit">kPa</span></div></div>
        <div class="card"><div class="label">ความชื้นดิน</div><div class="value"><span id="f4">--</span><span class="unit">%</span></div></div>
        <div class="card"><div class="label">eCO2</div><div class="value"><span id="f5">--</span><span class="unit">ppm</span></div></div>
        <div class="card"><div class="label">TVOC</div><div class="value"><span id="f6">--</span><span class="unit">ppb</span></div></div>
        <div class="card"><div class="label">สถานะฝน</div><div class="value"><span id="f7">--</span><span class="unit">%</span></div></div>
        <div class="card"><div class="label">ความเข้มแสง</div><div class="value"><span id="f8">--</span><span class="unit">%</span></div></div>
    </div>

    <div class="footer" id="last-update">อัปเดตล่าสุด: --</div>
</div>

<script>
    const CHANNEL_ID = "2687634";
    const READ_KEY = "YEYGJ3V1CV8V6OEY";
    
    let isAILive = false;
    let lastState = { rain: false, soilLow: false, vpdHigh: false, lightHigh: false };

    function initAI() {
        isAILive = true;
        document.getElementById('startBtn').innerText = "🟢 AI กำลังเฝ้าระวังฟาร์มของคุณ";
        document.getElementById('startBtn').classList.add('active');
        speak("ระบบแจ้งเตือนเสียงภาษาไทยเปิดใช้งานแล้วค่ะ กำลังเชื่อมต่อข้อมูลจากติงสปีค");
        fetchData();
        setInterval(fetchData, 16000); // ThingSpeak อัปเดตทุก 15-16 วินาที
    }

    async function fetchData() {
        try {
            const res = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?api_key=${READ_KEY}`);
            const data = await res.json();
            
            if (data) {
                // อัปเดตตัวเลขบนหน้าจอ
                const f = [data.field1, data.field2, data.field3, data.field4, data.field5, data.field6, data.field7, data.field8];
                for(let i=0; i<8; i++) {
                    const val = parseFloat(f[i]);
                    document.getElementById(`f${i+1}`).innerText = !isNaN(val) ? (i === 2 ? val.toFixed(2) : val.toFixed(1)) : "--";
                }
                document.getElementById('last-update').innerText = "อัปเดตล่าสุด: " + new Date(data.created_at).toLocaleString('th-TH');

                processAI(f);
            }
        } catch (e) { console.error("Error:", e); }
    }

    function processAI(fields) {
        const vpd = parseFloat(fields[2]);
        const soil = parseFloat(fields[3]);
        const rainRaw = parseFloat(fields[6]); // อ้างอิงจาก Arduino ที่ส่งค่า adc3 (30000=แห้ง)
        const light = parseFloat(fields[7]);

        let report = "สภาพแวดล้อมโดยรวมปกติค่ะ";
        
        // 1. ตรวจสอบฝน (ถ้าค่าต่ำกว่า 5000 คือฝนตก)
        if (rainRaw < 5000) {
            if (!lastState.rain) { speak("แจ้งเตือนค่ะ ขณะนี้ฝนตก ระบบปิดการรดน้ำแล้วค่ะ"); lastState.rain = true; }
            report = "⚠️ ฝนตก: ระบบหยุดทำงานเพื่อความปลอดภัย";
        } else { lastState.rain = false; }

        // 2. ตรวจสอบดิน
        if (soil < 30) {
            if (!lastState.soilLow) { speak("แจ้งเตือนค่ะ ความชื้นดินต่ำเกินไป กำลังเปิดน้ำรดดินค่ะ"); lastState.soilLow = true; }
            report = "💧 ดินแห้ง: ระบบกำลังเติมความชื้น";
        } else { lastState.soilLow = false; }

        // 3. ตรวจสอบ VPD (แดดร้อน/อากาศแห้ง)
        if (vpd > 1.6) {
            if (!lastState.vpdHigh) { speak("แจ้งเตือนค่ะ อากาศร้อนและแห้งเกินไป กำลังพ่นหมอกระบายความร้อนค่ะ"); lastState.vpdHigh = true; }
            report = "🔥 อากาศวิกฤต: พ่นหมอกลดค่า วี พี ดี";
            document.getElementById('vpd-box').style.color = "red";
        } else { lastState.vpdHigh = false; document.getElementById('vpd-box').style.color = "#2c3e50"; }

        // 4. ตรวจสอบแสง
        if (light > 85) {
            if (!lastState.lightHigh) { speak("แจ้งเตือนค่ะ แสงแดดแรงจัดเกินไป กำลังสั่งปิดหลังคาค่ะ"); lastState.lightHigh = true; }
            report = "☀️ แดดแรงจัด: ปิดหลังคาป้องกันพืชไหม้";
        } else { lastState.lightHigh = false; }

        document.getElementById('ai-text').innerText = report;
    }

    function speak(text) {
        if (!isAILive) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'th-TH';
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
