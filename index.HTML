<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Smart Farm AI PRO - Logic Monitor</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .active-card { background-color: #f0fdf4 !important; border-color: #22c55e !important; }
        .chart-box { background: white; padding: 20px; border-radius: 2rem; border: 1px solid #e2e8f0; margin-bottom: 20px; min-height: 350px; }
        .status-green { color: #10b981; } .status-orange { color: #f59e0b; } .status-red { color: #ef4444; }
        .status-blue { color: #3b82f6; font-weight: 800; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="bg-white/90 backdrop-blur-md flex flex-col md:flex-row justify-between items-center mb-6 gap-4 p-6 rounded-3xl shadow-sm border border-white">
            <div>
                <h1 class="text-3xl font-black text-slate-800 italic">Smart Farm <span class="text-green-500">AI PRO</span></h1>
                <div id="connection-status" class="text-slate-400 text-[10px] font-bold tracking-widest uppercase mt-1">Ready</div>
            </div>
            <div id="summary-text" class="text-xs font-bold text-slate-500 italic">SYNCING...</div>
            <div class="flex gap-2 p-1 bg-slate-200/50 rounded-2xl">
                <button onclick="setMode(0)" id="mode-auto" class="px-6 py-2 rounded-xl font-bold text-xs transition-all">AUTO</button>
                <button onclick="setMode(1)" id="mode-manual" class="px-6 py-2 rounded-xl font-bold text-xs transition-all">MANUAL</button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <button onclick="toggleDevice('V28', 'pump1')" id="btn-pump1" class="bg-white p-5 rounded-3xl border-2 border-transparent shadow-sm transition-all text-center">
                <i id="icon-pump1" class="fas fa-faucet text-2xl text-slate-300 mb-2"></i>
                <p class="text-[10px] font-black uppercase text-slate-500">Water Pump</p>
            </button>
            <button onclick="toggleDevice('V29', 'pump2')" id="btn-pump2" class="bg-white p-5 rounded-3xl border-2 border-transparent shadow-sm transition-all text-center">
                <i id="icon-pump2" class="fas fa-spray-can text-2xl text-slate-300 mb-2"></i>
                <p class="text-[10px] font-black uppercase text-slate-500">Mist Spray</p>
            </button>
            <button onclick="toggleDevice('V14', 'roof')" id="btn-roof" class="bg-white p-5 rounded-3xl border-2 border-transparent shadow-sm transition-all text-center">
                <i id="icon-roof" class="fas fa-warehouse text-2xl text-slate-300 mb-2"></i>
                <p class="text-[10px] font-black uppercase text-slate-500">Roof</p>
            </button>
            <button onclick="toggleDevice('V12', 'light')" id="btn-light" class="bg-white p-5 rounded-3xl border-2 border-transparent shadow-sm transition-all text-center">
                <i id="icon-light" class="fas fa-lightbulb text-2xl text-slate-300 mb-2"></i>
                <p class="text-[10px] font-black uppercase text-slate-500">Light</p>
            </button>
        </div>

        <div id="sensor-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

        <div class="chart-box"><div id="chart-upper" style="height: 300px;"></div></div>
        <div class="chart-box"><div id="chart-lower" style="height: 300px;"></div></div>

        <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative border border-slate-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black uppercase tracking-tighter italic"><i class="fas fa-robot text-green-400 mr-2"></i> AI Advisor & Arduino Logic</h2>
                <button onclick="generateAIReport()" id="ai-btn" class="bg-white text-slate-900 font-bold py-2 px-6 rounded-xl text-xs uppercase hover:bg-green-400 transition-all">Refresh AI</button>
            </div>
            <div id="ai-report" class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700 text-sm leading-relaxed min-h-[100px]">
                กำลังวิเคราะห์ข้อมูล...
            </div>
        </div>
    </div>

    <script>
        const CFG = {
            BLYNK_TOKEN: "YAZf3_nX5i3sx32pFKNk6t3GBHfy4U_l",
            BLYNK_URL: "http://blynk2.iot-cm.com:8080/",
            TS_CH: "2687634",
            TS_KEY: "YEYGJ3V1CV8V6OEY",
            GEMINI_KEY: "AIzaSyBTjjMzlRwftbrAWB6cKINCMLgee9mzmvQ"
        };

        let deviceStates = { pump1: 0, pump2: 0, roof: 0, light: 0, isManual: 0 };
        let historyData = [];

        // 1. Sync & Blynk
        async function syncStates() {
            try {
                const pins = ['V28', 'V29', 'V14', 'V12', 'V34'];
                const res = await Promise.all(pins.map(p => fetch(`${CFG.BLYNK_URL}${CFG.BLYNK_TOKEN}/get/${p}`).then(r => r.json())));
                deviceStates = { pump1: res[0][0], pump2: res[1][0], roof: res[2][0], light: res[3][0], isManual: res[4][0] };
                renderUI();
            } catch (e) { console.error("Sync Error:", e); }
        }

        async function updateBlynk(pin, val) {
            // ใช้ no-cors เพื่อแก้ปัญหา CORS (อย่าลืมตั้งค่า Site Settings ใน Browser)
            await fetch(`${CFG.BLYNK_URL}${CFG.BLYNK_TOKEN}/update/${pin}?value=${val}`, { mode: 'no-cors' });
        }

        function renderUI() {
            document.getElementById('mode-auto').className = `px-6 py-2 rounded-xl font-bold text-xs ${deviceStates.isManual == 0 ? 'bg-green-500 text-white' : 'text-slate-400'}`;
            document.getElementById('mode-manual').className = `px-6 py-2 rounded-xl font-bold text-xs ${deviceStates.isManual == 1 ? 'bg-orange-500 text-white' : 'text-slate-400'}`;
            
            const map = {pump1:['btn-pump1','icon-pump1','text-blue-500'], pump2:['btn-pump2','icon-pump2','text-blue-400'], roof:['btn-roof','icon-roof','text-orange-500'], light:['btn-light','icon-light','text-yellow-400']};
            Object.keys(map).forEach(k => {
                const [b, i, c] = map[k];
                if (deviceStates[k] == 1) { 
                    document.getElementById(b).classList.add('active-card'); 
                    document.getElementById(i).className = `fas ${document.getElementById(i).classList[1]} text-2xl ${c}`;
                } else { 
                    document.getElementById(b).classList.remove('active-card'); 
                    document.getElementById(i).className = `fas ${document.getElementById(i).classList[1]} text-2xl text-slate-300`;
                }
            });
        }

        // 2. Arduino Logic Monitor (ดักจับค่าแบบ Real-time)
        function arduinoLogicMonitor(latest) {
            const T = parseFloat(latest.field1), VPD = parseFloat(latest.field3), M = parseFloat(latest.field4), R = parseFloat(latest.field7), L = parseFloat(latest.field8);
            let insights = [];

            if (R > 80) insights.push("🌧️ ฝนตกหนัก: Arduino สั่งงดให้น้ำและรักษาระดับความชื้น");
            if (M > 80) insights.push("🌊 ดินแฉะเกินไป: ควรระงับการรดน้ำเพื่อป้องกันรากเน่า");
            else if (M < 40) insights.push("🏜️ ดินแห้ง: Arduino กำลังสั่งให้น้ำ (Pump 1)");

            if (VPD > 1.5) insights.push("🔥 VPD สูง: อากาศร้อนแห้งพืชคายน้ำมาก Arduino สั่งพ่นหมอก (Pump 2)");
            else if (VPD < 0.5) insights.push("🌫️ VPD ต่ำ: อากาศชื้นเกินไป พืชไม่คายน้ำ");

            if (L > 80) insights.push("☀️ แสงแดดแรงจัด: แนะนำให้ปิดหลังคาเพื่อลดความร้อน");

            document.getElementById('ai-report').innerHTML = insights.length > 0 ? insights.map(i => `<div class='mb-2'>${i}</div>`).join('') : "สภาพอากาศในฟาร์มปกติ";
        }

        async function fetchSensors() {
            try {
                const response = await fetch(`https://api.thingspeak.com/channels/${CFG.TS_CH}/feeds.json?api_key=${CFG.TS_KEY}&results=30`);
                const data = await response.json();
                historyData = data.feeds;
                const latest = historyData[historyData.length - 1];

                arduinoLogicMonitor(latest);
                updateSensorCards(latest);
                drawCharts();
                syncStates();
            } catch (e) { }
        }

        function getColorClass(label, val) {
            val = parseFloat(val);
            if (label === "Temp") return val > 35 ? 'status-red' : (val > 30 ? 'status-orange' : 'status-green');
            if (label === "VPD") return val > 1.6 ? 'status-red' : (val > 1.2 ? 'status-orange' : 'status-green');
            if (label === "Soil") return val < 30 ? 'status-red' : (val < 50 ? 'status-orange' : 'status-green');
            if (label === "Rain") return val > 50 ? 'status-blue' : 'status-green';
            return 'text-slate-700';
        }

        function updateSensorCards(latest) {
            const labels = ["Temp", "Humid", "VPD", "Soil", "CO2", "TVOC", "Rain", "Light"];
            document.getElementById('sensor-grid').innerHTML = labels.map((l, i) => {
                let val = parseFloat(latest['field'+(i+1)] || 0).toFixed(2);
                return `<div class="bg-white p-5 rounded-3xl border border-white shadow-sm">
                    <p class="text-[9px] font-bold text-slate-400 uppercase">${l}</p>
                    <h3 class="text-xl font-black ${getColorClass(l, val)}">${val}</h3>
                </div>`;
            }).join('');
        }

        function drawCharts() {
            const time = historyData.map(f => new Date(f.created_at).toLocaleTimeString());
            const opt = { chart: { type: 'areaspline', backgroundColor: 'transparent' }, title: { text: null }, xAxis: { categories: time, labels: {enabled: false} }, yAxis: { title: {text: null}, gridLineColor: '#f1f5f9' }, plotOptions: { areaspline: { fillOpacity: 0.1, marker: {enabled: false} } }, credits: { enabled: false } };

            Highcharts.chart('chart-upper', { ...opt, series: [
                { name: 'Temp', data: historyData.map(f => parseFloat(f.field1)), color: '#ef4444' },
                { name: 'Humid', data: historyData.map(f => parseFloat(f.field2)), color: '#3b82f6' },
                { name: 'Moist', data: historyData.map(f => parseFloat(f.field4)), color: '#10b981' },
                { name: 'VPD', data: historyData.map(f => parseFloat(f.field3)), color: '#f59e0b' }
            ]});

            Highcharts.chart('chart-lower', { ...opt, series: [
                { name: 'CO2', data: historyData.map(f => parseFloat(f.field5)), color: '#8b5cf6' },
                { name: 'TVOC', data: historyData.map(f => parseFloat(f.field6)), color: '#ec4899' },
                { name: 'Light', data: historyData.map(f => parseFloat(f.field8)), color: '#eab308' },
                { name: 'Rain', data: historyData.map(f => parseFloat(f.field7)), color: '#06b6d4' }
            ]});
        }

        async function generateAIReport() {
            const btn = document.getElementById('ai-btn'), box = document.getElementById('ai-report');
            btn.disabled = true; btn.innerText = "...";
            const s = historyData[historyData.length - 1];
            const prompt = `วิเคราะห์ฟาร์ม: Temp ${s.field1}C, VPD ${s.field3}, Soil ${s.field4}%, Rain ${s.field7}%. สรุป 3 ข้อสั้นๆ ภาษาไทย`;

            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CFG.GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const d = await r.json();
                if (d.candidates) box.innerHTML = `<div><b>AI วิเคราะห์:</b></div>${d.candidates[0].content.parts[0].text}`;
                else box.innerHTML = "⚠️ Quota AI เต็ม: กำลังแสดงผลการวิเคราะห์จาก Arduino แทน...";
            } catch (e) { box.innerHTML = "❌ AI Error: ตรวจสอบการตั้งค่า Browser"; }
            finally { btn.disabled = false; btn.innerText = "Refresh AI"; }
        }

        async function toggleDevice(pin, key) { 
            if (deviceStates.isManual == 0) return alert("โปรดเลือก MANUAL MODE"); 
            const next = deviceStates[key] == 1 ? 0 : 1; 
            await updateBlynk(pin, next); 
            deviceStates[key] = next; 
            renderUI(); 
        }
        async function setMode(val) { await updateBlynk('V34', val); deviceStates.isManual = val; renderUI(); }

        setInterval(fetchSensors, 15000);
        fetchSensors();
    </script>
</body>
</html>
